<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 270" width="240" height="270">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&amp;display=swap');
    </style>
  </defs>

  <!-- Fundal timbru -->
  <rect x="0" y="0" width="240" height="270" rx="4" ry="4" fill="#1d5282"/>

  <!-- Marginea dințată (simulată cu cercuri) -->
  <g fill="#e8f0f8">
    <!-- Sus -->
    <circle cx="12" cy="8" r="6"/><circle cx="28" cy="8" r="6"/><circle cx="44" cy="8" r="6"/>
    <circle cx="60" cy="8" r="6"/><circle cx="76" cy="8" r="6"/><circle cx="92" cy="8" r="6"/>
    <circle cx="108" cy="8" r="6"/><circle cx="124" cy="8" r="6"/><circle cx="140" cy="8" r="6"/>
    <circle cx="156" cy="8" r="6"/><circle cx="172" cy="8" r="6"/><circle cx="188" cy="8" r="6"/>
    <circle cx="204" cy="8" r="6"/><circle cx="220" cy="8" r="6"/>
    <!-- Jos -->
    <circle cx="12" cy="262" r="6"/><circle cx="28" cy="262" r="6"/><circle cx="44" cy="262" r="6"/>
    <circle cx="60" cy="262" r="6"/><circle cx="76" cy="262" r="6"/><circle cx="92" cy="262" r="6"/>
    <circle cx="108" cy="262" r="6"/><circle cx="124" cy="262" r="6"/><circle cx="140" cy="262" r="6"/>
    <circle cx="156" cy="262" r="6"/><circle cx="172" cy="262" r="6"/><circle cx="188" cy="262" r="6"/>
    <circle cx="204" cy="262" r="6"/><circle cx="220" cy="262" r="6"/>
    <!-- Stânga -->
    <circle cx="8" cy="24" r="6"/><circle cx="8" cy="40" r="6"/><circle cx="8" cy="56" r="6"/>
    <circle cx="8" cy="72" r="6"/><circle cx="8" cy="88" r="6"/><circle cx="8" cy="104" r="6"/>
    <circle cx="8" cy="120" r="6"/><circle cx="8" cy="136" r="6"/><circle cx="8" cy="152" r="6"/>
    <circle cx="8" cy="168" r="6"/><circle cx="8" cy="184" r="6"/><circle cx="8" cy="200" r="6"/>
    <circle cx="8" cy="216" r="6"/><circle cx="8" cy="232" r="6"/><circle cx="8" cy="248" r="6"/>
    <!-- Dreapta -->
    <circle cx="232" cy="24" r="6"/><circle cx="232" cy="40" r="6"/><circle cx="232" cy="56" r="6"/>
    <circle cx="232" cy="72" r="6"/><circle cx="232" cy="88" r="6"/><circle cx="232" cy="104" r="6"/>
    <circle cx="232" cy="120" r="6"/><circle cx="232" cy="136" r="6"/><circle cx="232" cy="152" r="6"/>
    <circle cx="232" cy="168" r="6"/><circle cx="232" cy="184" r="6"/><circle cx="232" cy="200" r="6"/>
    <circle cx="232" cy="216" r="6"/><circle cx="232" cy="232" r="6"/><circle cx="232" cy="248" r="6"/>
  </g>

  <!-- Zona interioară -->
  <rect x="16" y="16" width="208" height="238" rx="2" ry="2" fill="#1e5483"/>

  <!-- Textul "Scrisorile" sus -->
  <text x="120" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#f0dea0" letter-spacing="1">Scrisori</text>

  <!-- Linie decorativă -->
  <line x1="35" y1="58" x2="205" y2="58" stroke="#c8a96e" stroke-width="0.8" opacity="0.6"/>

  <!-- Ilustrația florală centrală (rose și flowers stilizate) -->
  <!-- Trandafir principal (mare, roșu) -->
  <circle cx="120" cy="140" r="42" fill="#c0392b" opacity="0.9"/>
  <circle cx="120" cy="140" r="32" fill="#e74c3c"/>
  <circle cx="120" cy="140" r="22" fill="#c0392b"/>
  <circle cx="120" cy="140" r="14" fill="#922b21"/>
  <!-- Petale trandafir -->
  <ellipse cx="120" cy="98" rx="12" ry="20" fill="#e74c3c" opacity="0.85"/>
  <ellipse cx="120" cy="182" rx="12" ry="20" fill="#e74c3c" opacity="0.85"/>
  <ellipse cx="78" cy="140" rx="20" ry="12" fill="#e74c3c" opacity="0.85"/>
  <ellipse cx="162" cy="140" rx="20" ry="12" fill="#e74c3c" opacity="0.85"/>
  <ellipse cx="91" cy="111" rx="12" ry="18" fill="#e74c3c" opacity="0.75" transform="rotate(-45 91 111)"/>
  <ellipse cx="149" cy="111" rx="12" ry="18" fill="#e74c3c" opacity="0.75" transform="rotate(45 149 111)"/>
  <ellipse cx="91" cy="169" rx="12" ry="18" fill="#e74c3c" opacity="0.75" transform="rotate(45 91 169)"/>
  <ellipse cx="149" cy="169" rx="12" ry="18" fill="#e74c3c" opacity="0.75" transform="rotate(-45 149 169)"/>

  <!-- Flori mici albastre/lila în stânga -->
  <circle cx="55" cy="155" r="8" fill="#7fb3d3" opacity="0.9"/>
  <circle cx="45" cy="145" r="6" fill="#85c1e9" opacity="0.8"/>
  <circle cx="60" cy="168" r="7" fill="#7fb3d3" opacity="0.85"/>
  <circle cx="40" cy="160" r="5" fill="#aed6f1" opacity="0.8"/>

  <!-- Frunze verzi -->
  <ellipse cx="80" cy="170" rx="18" ry="8" fill="#1e8449" opacity="0.75" transform="rotate(-30 80 170)"/>
  <ellipse cx="165" cy="115" rx="16" ry="7" fill="#27ae60" opacity="0.7" transform="rotate(20 165 115)"/>
  <ellipse cx="75" cy="115" rx="14" ry="6" fill="#1e8449" opacity="0.65" transform="rotate(150 75 115)"/>

  <!-- Linie decorativă -->
  <line x1="35" y1="200" x2="205" y2="200" stroke="#c8a96e" stroke-width="0.8" opacity="0.6"/>

  <!-- Text "cu Flori" jos -->
  <text x="120" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="bold" fill="#f0dea0" letter-spacing="2">Cu Povesti</text>

  <!-- Ornament jos mic -->
  <text x="120" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c8a96e" opacity="0.8">— România —</text>
</svg>
