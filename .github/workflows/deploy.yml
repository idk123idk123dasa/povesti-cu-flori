name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Static Site

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Site-ul static e prea mare pentru GitHub (237MB).
          # Deploy-ul se face local via git hook post-commit + deploy.py
          # Acest workflow e placeholder pentru viitoare build-uri.
          echo "Deploy via git hook local (deploy.py). Site: scrisoricupovesti.ro/site/"
