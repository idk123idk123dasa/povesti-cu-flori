<script>
/* Force nav links to navigate before GemPage can intercept */
(function(){
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href]');
    if (!a) return;
    if (!a.closest('#AccessibleNav, #custom-nav, #MobileNav, .nav-bottom-cta, .announcement-bar')) return;
    var href = a.getAttribute('href');
    if (!href || href.charAt(0) === '#') return;
    e.stopImmediatePropagation();
    window.location.href = href;
  }, true);
})();
</script>

<style>
#MobileNav{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;overflow-y:auto;padding:20px;opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .28s ease, transform .28s ease, visibility 0s linear .28s;}
#MobileNav.open{opacity:1;visibility:visible;transform:translateY(0);transition:opacity .28s ease, transform .28s ease, visibility 0s linear 0s;}
#MobileNav .m-submenu{list-style:none;padding:0 0 0 16px;margin:0;max-height:0;overflow:hidden;transition:max-height .35s ease, margin-top .35s ease;}

#MobileNav .m-chev{display:inline-block;transition:transform .3s ease;font-size:14px;}
#MobileNav .m-more-toggle.open .m-chev{transform:rotate(180deg);}
</style>
<div id="MobileNav">

        <ul class="m-submenu">

        </ul>
      </li>
    </ul>
  </nav>
</div>
<script>
(function() {
  function openMobileNav() {
    var nav = document.getElementById('MobileNav');
    if (nav){nav.classList.add('open');}
    document.body.classList.add('menu-open');
    document.body.style.overflow = 'hidden';
  }
  function closeMobileNav() {
    var nav = document.getElementById('MobileNav');
    if (nav){nav.classList.remove('open');}
    document.body.classList.remove('menu-open');
    document.body.style.overflow = '';
  }
  document.addEventListener('DOMContentLoaded', function() {
    var toggleBtns = document.querySelectorAll('.js-mobile-nav-toggle');
    toggleBtns.forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var nav = document.getElementById('MobileNav');
        if (nav && nav.classList.contains('open')) closeMobileNav(); else openMobileNav();
      });
    });
    var closeBtn = document.getElementById('MobileNavClose');
    if (closeBtn) closeBtn.addEventListener('click', closeMobileNav);
    var more = document.querySelector('#MobileNav .m-more-toggle');
    if(more){more.addEventListener('click', function(){
      var sub = this.nextElementSibling;
      this.classList.toggle('open');
      if(sub) sub.classList.toggle('open');
    });}
  });
})();
</script>
