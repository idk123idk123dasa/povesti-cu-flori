<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina nu există — Scrisori Cu Povesti</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon-round.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'EB Garamond',Georgia,serif;background:#FBF9F6;color:#2B3B2B;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;text-align:center}
.box{max-width:560px}
.code{font-family:'Playfair Display',serif;font-weight:900;font-size:120px;line-height:1;color:#ac3135;margin:0 0 12px}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:32px;margin:0 0 18px;color:#2B3B2B}
p{font-size:17px;color:#5b5b5b;margin:0 0 30px;line-height:1.55}
.btn{display:inline-block;background:#ac3135;color:#fff;padding:14px 34px;border-radius:30px;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.btn:hover{background:#842629}
</style>
</head>
<body>
<main>
  <div class="box">
    <p class="code">404</p>
    <h1>Pagina nu există</h1>
    <p>Ne pare rău, pagina pe care ați încercat să o accesați nu mai este disponibilă sau a fost mutată.</p>
    <a href="/" class="btn">Înapoi la prima pagină</a>
  </div>
</main>
</body>
</html>
